name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          SELECTED=""
          for APP in /Applications/Xcode*.app; do
            DEVELOPER_PATH="$APP/Contents/Developer"
            SDK_VERSION=$(DEVELOPER_DIR="$DEVELOPER_PATH" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null) || continue
            if [ "${SDK_VERSION%%.*}" -ge 26 ]; then
              SELECTED="$DEVELOPER_PATH"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::No installed Xcode supports iOS 26."
            exit 1
          fi
          export DEVELOPER_DIR="$SELECTED"
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::MangaShelf requires Xcode with iOS 26 SDK or newer."
            exit 1
          fi
      - name: Build unsigned device IPA
        run: bash scripts/build-ios.sh unsigned
      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MangaShelf-unsigned
          path: build/Export/MangaShelf-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
