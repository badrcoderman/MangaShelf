name: Build iPhone IPA
on:
  workflow_dispatch:
    inputs:
      embedded_engine:
        description: Include the source-built interpreter VM, verified host and codec
        required: false
        default: true
        type: boolean
      runtime_run_id:
        description: Successful source-built iOS JVM image run
        required: false
        default: '39818913578'
        type: string
      repository_probe:
        description: Verify JSON and gzip protobuf against a pinned public repository snapshot
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          SELECTED=""
          for APP in /Applications/Xcode*.app; do
            DEVELOPER_PATH="$APP/Contents/Developer"
            SDK_VERSION=$(DEVELOPER_DIR="$DEVELOPER_PATH" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null) || continue
            if [ "${SDK_VERSION%%.*}" -ge 26 ]; then
              SELECTED="$DEVELOPER_PATH"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::No installed Xcode supports iOS 26."
            exit 1
          fi
          export DEVELOPER_DIR="$SELECTED"
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::MangaShelf requires Xcode with iOS 26 SDK or newer."
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: inputs.embedded_engine
        with:
          distribution: temurin
          java-version: '25'
      - name: Download verified source-built runtime image
        if: inputs.embedded_engine
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: >-
          python3 scripts/download-ios-jvm-evidence.py
          --repository "$GITHUB_REPOSITORY" --run-id "$RUNTIME_RUN_ID"
          --destination build/ios-app-runtime-evidence --provenance build/ios-app-runtime-selection
      - name: Build and prepare the current host and iOS codec
        if: inputs.embedded_engine
        run: |
          python3 scripts/prepare-ios-app-engine.py --build \
            --runtime-evidence build/ios-app-runtime-evidence/build/ios-jvm \
            --runtime-selection build/ios-app-runtime-selection/runtime-selection.json
          echo "MSL_ENGINE_INPUTS=$GITHUB_WORKSPACE/build/ios-app-engine/EngineInputs.json" >> "$GITHUB_ENV"
      - name: Download pinned public repository snapshot
        if: inputs.repository_probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/download-pinned-repository.py --destination build/repository-index-probe
          echo "MSL_REFERENCE_INDEX_DIR=$GITHUB_WORKSPACE/build/repository-index-probe" >> "$GITHUB_ENV"
      - name: Build unsigned device IPA
        run: bash scripts/build-ios.sh unsigned
      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MangaShelf-unsigned
          path: build/Export/MangaShelf-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Preserve engine build provenance
        if: always() && inputs.embedded_engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MangaShelf-engine-build-evidence
          path: |
            build/ios-app-engine/EngineInputs.json
            build/ios-app-engine/app-manifest.json
            build/ios-app-engine/Engine.xcconfig
            build/ios-app-runtime-selection/
            validation/runtime-host-build.json
            validation/zstd-native-ios.json
          if-no-files-found: warn
          retention-days: 14
