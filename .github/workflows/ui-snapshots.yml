name: Capture native iPhone UI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-snapshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, install, launch and capture the real app
        run: bash scripts/capture_ui_snapshots.sh
      - name: Upload screenshots, xcresult and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MangaShelf-UI-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ui-snapshots/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
