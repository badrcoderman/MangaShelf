name: Build pinned reference source JAR
on:
  workflow_dispatch:
    inputs:
      task:
        description: Choose the pinned source build or authored runtime host checks
        type: choice
        options:
          - reference-extension
          - reference-teamx
          - runtime-host
          - runtime-codec
        default: reference-extension
permissions:
  contents: read
jobs:
  compile:
    if: inputs.task == 'reference-extension' || inputs.task == 'reference-teamx'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keiyoushi/extensions-source
          ref: 1d3d7c4b3e876fb0c26ae3ade8113fb329af15fa
          path: extension-src/keiyoushi
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned source's Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Build reviewed reference JAR from public source
        env:
          MSL_REFERENCE_SOURCE: ${{ inputs.task == 'reference-teamx' && 'teamx' || 'mangadex' }}
        run: bash scripts/build-reference-extension.sh
      - name: Preserve source JAR and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.task == 'reference-teamx' && 'teamx-source-build' || 'mangadex-source-build' }}
          path: build/reference-extension/
          if-no-files-found: warn
          retention-days: 14
  runtime-host:
    if: inputs.task == 'runtime-host' || inputs.task == 'runtime-codec'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Remove historical check reports
        # Remove historical reports so skipped checks cannot upload old passes.
        # These paths are generated evidence in this disposable checkout.
        run: |
          rm -f validation/runtime-host-build.json validation/runtime-host-tests.json \
            validation/runtime-preferences-host.json validation/runtime-network-host.json validation/runtime-bootstrap-host.json \
            validation/runtime-source-preferences-host.json validation/runtime-source-commands-host.json \
            validation/bridge-test-results.json validation/java-bridge-host.json \
            validation/runtime-zstd-host.json validation/zstd-native-host.json validation/zstd-native-ios.json \
            validation/extension-archive-verifier-host.json validation/extension-loader-host.json
      - name: Check pinned API and source registry
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-host.py
      - name: Check durable extension preferences
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-preferences.py
      - name: Check source-built Injekt and application bootstrap
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-bootstrap.py
      - name: Check source settings and callback lifetime
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-source-preferences.py
      - name: Check Source 1.6 JSON conversion and state round trips
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-source-commands.py
      - name: Check owned C callback responses and sanitizers
        if: inputs.task == 'runtime-host'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python3 -u scripts/test_bridge.py --no-leak-check
          else
            python3 -u scripts/test_bridge.py
          fi
      - name: Check common owned response through the actual JNI adapter
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-java-bridge.py
      - name: Check authored HTTP sources and TLS on host JVM
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-runtime-network.py
      - name: Check source-built codec, JNI failures and builtin loading
        run: python3 -u scripts/test-runtime-zstd.py
      - name: Select iOS 26 toolchain for codec compilation
        if: runner.os == 'macOS'
        run: |
          for APP in /Applications/Xcode*.app; do
            DEV="$APP/Contents/Developer"
            SDK=$(DEVELOPER_DIR="$DEV" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null) || continue
            if [ "${SDK%%.*}" -ge 26 ]; then
              echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo '::error::iOS 26 SDK missing'
          exit 1
      - name: Compile and link codec JNI for arm64 iOS without execution
        if: runner.os == 'macOS'
        run: python3 -u scripts/build-zstd-native.py --target ios
      - name: Check signatures and bounded archive handling
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-extension-archive-verifier.py
      - name: Load authored signed SourceFactory fixtures
        if: inputs.task == 'runtime-host'
        run: python3 -u scripts/test-extension-loader.py
      - name: Preserve authored host and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-host-check-${{ matrix.os }}
          path: |
            validation/runtime-host-build.json
            validation/runtime-host-tests.json
            validation/runtime-preferences-host.json
            validation/runtime-network-host.json
            validation/runtime-bootstrap-host.json
            validation/runtime-source-preferences-host.json
            validation/runtime-source-commands-host.json
            validation/bridge-test-results.json
            validation/java-bridge-host.json
            validation/runtime-zstd-host.json
            validation/zstd-native-host.json
            validation/zstd-native-ios.json
            validation/extension-archive-verifier-host.json
            validation/extension-loader-host.json
            build/runtime-host/runtime-host.jar
            build/zstd-native/host/libmslzstd.a
            build/zstd-native/host/notices/
            build/zstd-native/ios/libmslzstd.a
            build/zstd-native/ios/MSLZstdLinkProbe
            build/zstd-native/ios/notices/
          if-no-files-found: warn
          retention-days: 14
