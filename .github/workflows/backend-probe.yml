name: Build pinned reference source JAR
on:
  workflow_dispatch:
    inputs:
      task:
        description: Choose the pinned source build or authored runtime host checks
        type: choice
        options:
          - reference-extension
          - runtime-host
        default: reference-extension
permissions:
  contents: read
jobs:
  compile:
    if: inputs.task != 'runtime-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keiyoushi/extensions-source
          ref: 1d3d7c4b3e876fb0c26ae3ade8113fb329af15fa
          path: extension-src/keiyoushi
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned source's Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Build MangaDex reference JAR from public source
        run: bash scripts/build-reference-extension.sh
      - name: Preserve source JAR and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mangadex-source-build
          path: build/reference-extension/
          if-no-files-found: warn
          retention-days: 14
  runtime-host:
    if: inputs.task == 'runtime-host'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Check pinned API and source registry
        # Remove historical reports so skipped checks cannot upload old passes.
        # These paths are generated evidence in this disposable checkout.
        run: |
          rm -f validation/runtime-host-build.json validation/runtime-host-tests.json \
            validation/runtime-preferences-host.json validation/runtime-network-host.json \
            validation/extension-archive-verifier-host.json validation/extension-loader-host.json
          python3 -u scripts/test-runtime-host.py
      - name: Check durable extension preferences
        run: python3 -u scripts/test-runtime-preferences.py
      - name: Check authored HTTP sources and TLS on host JVM
        run: python3 -u scripts/test-runtime-network.py
      - name: Check signatures and bounded archive handling
        run: python3 -u scripts/test-extension-archive-verifier.py
      - name: Load authored signed SourceFactory fixtures
        run: python3 -u scripts/test-extension-loader.py
      - name: Preserve authored host and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-host-check-${{ matrix.os }}
          path: |
            validation/runtime-host-build.json
            validation/runtime-host-tests.json
            validation/runtime-preferences-host.json
            validation/runtime-network-host.json
            validation/extension-archive-verifier-host.json
            validation/extension-loader-host.json
            build/runtime-host/runtime-host.jar
          if-no-files-found: warn
          retention-days: 14
