name: Build pinned reference source JAR
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keiyoushi/extensions-source
          ref: 1d3d7c4b3e876fb0c26ae3ade8113fb329af15fa
          path: extension-src/keiyoushi
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned source's Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"'
      - name: Build MangaDex reference JAR from public source
        run: bash scripts/build-reference-extension.sh
      - name: Preserve source JAR and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mangadex-source-build
          path: build/reference-extension/
          if-no-files-found: warn
          retention-days: 14
